name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # nightly at 06:00 UTC

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/ai-service

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Node dependencies
        run: pnpm audit --audit-level high

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./apps/ai-service[dev]" pip-audit
          python -m pip_audit

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: apps/ai-service
          file: apps/ai-service/Dockerfile
          push: false
          tags: lunacrypto-ai-service:ci

  monorepo-gates:
    name: Monorepo API Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for workspace lint
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python lint dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run workspace lint
        run: pnpm lint

      - name: Build API
        run: pnpm build:api

      - name: Test API
        run: pnpm --filter @lunaperception/api test

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ruff full lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy
        run: mypy tradingagents cli

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs: [lint, type-check, secret-scan, dependency-audit, docker-build]

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Import smoke test
        run: |
          python -c "import cli; import tradingagents"

      - name: Compile modules
        run: |
          python -m compileall tradingagents cli tests

      - name: Run unit tests
        env:
          OPENAI_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          XAI_API_KEY: placeholder
          DEEPSEEK_API_KEY: placeholder
          DASHSCOPE_API_KEY: placeholder
          ZHIPU_API_KEY: placeholder
          OPENROUTER_API_KEY: placeholder
          AZURE_OPENAI_API_KEY: placeholder
          ALPHA_VANTAGE_API_KEY: placeholder
        run: |
          python -m pytest -m "unit" -v

      - name: Run remaining tests
        if: always()
        env:
          OPENAI_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          XAI_API_KEY: placeholder
          DEEPSEEK_API_KEY: placeholder
          DASHSCOPE_API_KEY: placeholder
          ZHIPU_API_KEY: placeholder
          OPENROUTER_API_KEY: placeholder
          AZURE_OPENAI_API_KEY: placeholder
          ALPHA_VANTAGE_API_KEY: placeholder
        run: |
          python -m pytest -m "not unit" -v

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run coverage threshold
        env:
          OPENAI_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          XAI_API_KEY: placeholder
          DEEPSEEK_API_KEY: placeholder
          DASHSCOPE_API_KEY: placeholder
          ZHIPU_API_KEY: placeholder
          OPENROUTER_API_KEY: placeholder
          AZURE_OPENAI_API_KEY: placeholder
          ALPHA_VANTAGE_API_KEY: placeholder
        run: |
          python -m pytest --cov=tradingagents --cov=cli --cov-report=term-missing --cov-fail-under=55

  sqlite-smoke:
    name: SQLite Migration Backup Restore Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, type-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run SQLite smoke test
        run: |
          python -m pytest tests/test_sqlite_migration_backup_restore.py -v
