name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Import smoke test
        run: |
          python -c "import cli; import tradingagents"

      - name: Ruff critical checks
        run: |
          python -m ruff check . --select E9,F63,F7,F82

      - name: Compile modules
        run: |
          python -m compileall tradingagents cli tests

      - name: Run tests
        env:
          OPENAI_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          XAI_API_KEY: placeholder
          DEEPSEEK_API_KEY: placeholder
          DASHSCOPE_API_KEY: placeholder
          ZHIPU_API_KEY: placeholder
          OPENROUTER_API_KEY: placeholder
          AZURE_OPENAI_API_KEY: placeholder
          ALPHA_VANTAGE_API_KEY: placeholder
        run: |
          python -m pytest
