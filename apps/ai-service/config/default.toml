# LunaCrypto default configuration.
#
# This file is auto-loaded by ConfigLoader as the second layer:
# code defaults -> config/default.toml -> config/local.toml -> profile -> env -> CLI.
# Copy only the settings you want to change into config/local.toml.
#
# TOML note: all root-level keys must appear before the first [section].

# LLM settings
llm_provider = "deepseek"
deep_think_llm = "deepseek-v4-pro"
quick_think_llm = "deepseek-v4-flash"
# backend_url = "https://example.com/v1"
# google_thinking_level = "high"
# openai_reasoning_effort = "medium"
# anthropic_effort = "medium"

# Runtime environment / asset class
runtime_environment = "local" # "local" | "dev" | "production"
asset_class = "crypto"
market_type = "spot" # "spot" | "perp"
crypto_exchange = "binance"
crypto_benchmark = "BTC/USDT"

# Output language
output_language = "English"

# Debate and discussion
max_debate_rounds = 1
max_risk_discuss_rounds = 1
max_recur_limit = 100

# Data vendor disable list
disabled_data_vendors = []

# Checkpoint / resume
checkpoint_enabled = false

[market_context]
enabled = true
primary_venue = "binance"
validation_venues = ["okx", "bybit", "bitget"]
divergence_threshold_bps = 25.0

[news_context]
enabled = true
lookback_days = 7
feed_timeout_sec = 8.0
workspace_sources = []

[config_validation]
mode = "fail_fast"
validate_llm_keys = true

[config_search_paths]
default_toml = "config/default.toml"
local_toml = "config/local.toml"

[llm_fallback]
enabled = true
fallback_providers = ["openrouter", "openai"]
circuit_breaker_threshold = 3
circuit_breaker_window_sec = 300

# Cross-provider model mapping. When the orchestrator switches to a fallback
# provider it can use these model names instead of the primary provider's models.
[llm_fallback.fallback_model_map]
# openai = { deep = "gpt-4o", quick = "gpt-4o-mini" }
# openrouter = { deep = "openai/gpt-4o", quick = "openai/gpt-4o-mini" }
# anthropic = { deep = "claude-sonnet-4-20250514", quick = "claude-haiku-3-5-20241022" }
# google = { deep = "gemini-2.5-pro", quick = "gemini-2.5-flash" }
# deepseek = { deep = "deepseek-chat", quick = "deepseek-chat" }

[secrets]
source = "env" # "env" | "keyring" | "env,keyring"
warn_on_plaintext_env = true

[data_vendors]
technical_indicators = "ccxt"
news_data = "ccxt"
crypto_ohlcv = "ccxt"
crypto_onchain = "ccxt,coingecko"

[tool_vendors]

[provider_runtime]
enabled = true
timeout_sec = 20.0
retries = 2
backoff_base_sec = 0.35
backoff_max_sec = 2.5
rate_limit_per_sec = 8.0
max_workers = 8

[signal_weights]
version = "signal_weights:v1:2026-05-13"
funding_oi = 0.20
rsi_divergence = 0.12
macd = 0.08
volume_profile = 0.12
liquidations = 0.12
regime = 0.16
onchain = 0.20

[signal_thresholds]
strong_buy = 0.60
buy = 0.25
sell = -0.25
strong_sell = -0.60

# Hypothetical sizing for reports only. This is not execution sizing.
[fixed_sizing]
buy = 0.25
overweight = 0.15
hold = 0.0
underweight = -0.10
sell = -1.0

[thesis_stability]
enabled = true
cooldown_minutes = 60
max_confidence_delta = 0.20
flip_override_confidence = 0.75
memory_limit = 50

[stale_data]
mode = "warn"
max_age_hours = 24.0

[evaluation]
auto_evaluate_enabled = true
auto_evaluate_max_batch = 5
feedback_enabled = true
require_strict_replay = true
window_days = 14
degradation_threshold = 0.20
critical_threshold = 0.40
min_performance_sample_size = 30
min_out_of_sample_size = 10

[historical_data]
default_lookback_days = 30
strict_mode = true

[observability]
persist_run_events = true
persist_data_provider_calls = true
persist_llm_calls = true
persist_data_freshness_checks = true
persist_snapshot_health = true
data_provider_call_sample_rate = 1.0
opentelemetry_enabled = false
service_name = "lunacrypto"

[cli_logging]
message_preview_chars = 512
max_report_section_chars = 20000
max_log_bytes = 1048576
max_rotated_logs = 3
persist_raw_llm_output = false
