# TradingAgents — Default configuration (TOML)
# This file is auto-loaded by ConfigLoader as the second layer
# (after code defaults, before local.toml and env vars).
#
# All values here match tradingagents/default_config.py::DEFAULT_CONFIG.
# Copy sections you want to change into config/local.toml.

# ── Config validation ────────────────────────────────────────────────────────
[config_validation]
mode = "fail_fast"
validate_llm_keys = true

# ── Config search paths ──────────────────────────────────────────────────────
[config_search_paths]
default_toml = "config/default.toml"
local_toml = "config/local.toml"

# ── LLM settings ─────────────────────────────────────────────────────────────
llm_provider = "deepseek"
deep_think_llm = "deepseek-v4-pro"
quick_think_llm = "deepseek-v4-flash"
# backend_url: leave unset to use each provider's default endpoint
# google_thinking_level: "high", "minimal", etc.
# openai_reasoning_effort: "medium", "high", "low"
# anthropic_effort: "high", "medium", "low"

# ── LLM provider fallback ────────────────────────────────────────────────────
[llm_fallback]
enabled = true
fallback_providers = ["openrouter", "openai"]
circuit_breaker_threshold = 3
circuit_breaker_window_sec = 300

# Cross-provider model mapping.  When the orchestrator switches to a
# fallback provider it uses these model names instead of the primary
# provider's models (which usually do not exist on the fallback).
# Built-in defaults cover the common providers; uncomment and
# customise if you need different models.
[llm_fallback.fallback_model_map]
# openai = { deep = "gpt-4o", quick = "gpt-4o-mini" }
# openrouter = { deep = "openai/gpt-4o", quick = "openai/gpt-4o-mini" }
# anthropic = { deep = "claude-sonnet-4-20250514", quick = "claude-haiku-3-5-20241022" }
# google = { deep = "gemini-2.5-pro", quick = "gemini-2.5-flash" }
# deepseek = { deep = "deepseek-chat", quick = "deepseek-chat" }


# ── Secrets ──────────────────────────────────────────────────────────────────
[secrets]
source = "env"         # "env" | "keyring" | "env,keyring"
warn_on_plaintext_env = true

# ── Runtime environment / asset class ────────────────────────────────────────
runtime_environment = "local" # "local" | "dev" | "production"
asset_class = "crypto"
market_type = "spot" # "spot" | "perp"
crypto_exchange = "binance"
crypto_benchmark = "BTC/USDT"

# ── Output language ──────────────────────────────────────────────────────────
output_language = "English"

# ── Debate and discussion ────────────────────────────────────────────────────
max_debate_rounds = 1
max_risk_discuss_rounds = 1
max_recur_limit = 100

# ── Data vendor disable list ──────────────────────────────────────────────────
disabled_data_vendors = []

# ── Checkpoint / resume ──────────────────────────────────────────────────────
checkpoint_enabled = false

# ── Data vendors ─────────────────────────────────────────────────────────────
[data_vendors]
technical_indicators = "ccxt"
news_data = "ccxt"
crypto_ohlcv = "ccxt"
crypto_onchain = "ccxt,coingecko"

[tool_vendors]

# ── Provider runtime resilience ──────────────────────────────────────────────
[provider_runtime]
enabled = true
timeout_sec = 20.0
retries = 2
backoff_base_sec = 0.35
backoff_max_sec = 2.5
rate_limit_per_sec = 8.0

# ── Signal / quant weights (research-tuning knobs) ───────────────────────────
[signal_weights]
funding_oi = 0.20
rsi_divergence = 0.12
macd = 0.08
volume_profile = 0.12
liquidations = 0.12
regime = 0.16
onchain = 0.20

[signal_thresholds]
strong_buy = 0.60
buy = 0.25
sell = -0.25
strong_sell = -0.60

# ── Fixed position sizing ────────────────────────────────────────────────────
[fixed_sizing]
buy = 0.25
overweight = 0.15
hold = 0.0
underweight = -0.10
sell = -1.0

# ── Stale data ───────────────────────────────────────────────────────────────
[stale_data]
mode = "warn"
max_age_hours = 24.0

# ── Observability ────────────────────────────────────────────────────────────
[observability]
persist_run_events = true
persist_data_provider_calls = true
persist_llm_calls = true
persist_data_freshness_checks = true
persist_snapshot_health = true
data_provider_call_sample_rate = 1.0
opentelemetry_enabled = false
service_name = "tradingagents"
