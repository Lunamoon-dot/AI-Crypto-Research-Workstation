# Example local overrides. Copy this file to config/local.toml and edit it.
#
# TOML note: root-level overrides must appear before the first [section].

# Example local LLM override:
# llm_provider = "openai"
# quick_think_llm = "gpt-5-mini"
# deep_think_llm = "gpt-5"

# Optional report language override for all local CLI/engine runs.
# Per-run API requests can still override this value.
# output_language = "Vietnamese"

runtime_environment = "local"
disabled_data_vendors = []

[llm_runtime]
timeout_sec = 60.0

[config_validation]
mode = "warn"
validate_llm_keys = true

[data_vendors]
technical_indicators = "ccxt"
news_data = "ccxt"
crypto_ohlcv = "ccxt"
crypto_onchain = "ccxt,coingecko"

[tool_vendors]
# get_crypto_nvt = "coingecko"

[provider_runtime]
enabled = true
timeout_sec = 20.0
retries = 2
backoff_base_sec = 0.35
backoff_max_sec = 2.5
rate_limit_per_sec = 8.0

[news_context]
enabled = true
lookback_days = 7
feed_timeout_sec = 8.0
workspace_sources = []

# Example workspace source:
# [[news_context.workspace_sources]]
# name = "Arbitrum governance forum"
# type = "rss"
# url = "https://forum.arbitrum.foundation/latest.rss"
# scope = ["ARB"]
# trust_tier = "user_trusted"
# category = "official_project"

[observability]
persist_run_events = true
persist_data_provider_calls = true
persist_llm_calls = true
persist_data_freshness_checks = true
persist_snapshot_health = true
data_provider_call_sample_rate = 0.25
