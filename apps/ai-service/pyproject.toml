[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luna_workstation"
version = "0.3.0"
description = "LunaCrypto: AI crypto research workstation and trade-thesis copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "ccxt>=4.4.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.8.0",
    "pip-audit>=2.8.0",
    "pytest-cov>=5.0.0",
    "alembic>=1.13.0",
    "hypothesis>=6.100.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.scripts]
lunacrypto = "cli.main:app"

[tool.setuptools.packages.find]
include = ["luna_workstation*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
explicit_package_bases = true
warn_no_return = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

# LangChain chat model constructors are dynamically typed; kwargs and monkey-patches
# do not satisfy mypy's view of upstream stubs.
[[tool.mypy.overrides]]
module = [
    "luna_workstation.llm_clients.anthropic_client",
    "luna_workstation.llm_clients.google_client",
    "luna_workstation.llm_clients.openai_client",
    "luna_workstation.llm_clients.azure_client",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "luna_workstation.types",
    "luna_workstation.engine.*",
    "luna_workstation.storage.serialization",
    "luna_workstation.storage.sqlite",
    "luna_workstation.dataflows.protocols",
    "luna_workstation.graph.protocols",
]
check_untyped_defs = true

[tool.ruff.lint]
ignore = ["E402"]  # module-import-not-at-top-of-file: lazy imports are by design

[tool.ruff.lint.per-file-ignores]
"luna_workstation/graph/setup.py" = ["F403", "F405"]  # star imports from agents package
"luna_workstation/graph/research_agents_graph.py" = ["F403"]  # star imports from agents package
