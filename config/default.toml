# TradingAgents — Default configuration (TOML)
# This file is auto-loaded by ConfigLoader as the second layer
# (after code defaults, before local.toml and env vars).
#
# All values here match tradingagents/default_config.py::DEFAULT_CONFIG.
# Copy sections you want to change into config/local.toml.

# ── Config validation ────────────────────────────────────────────────────────
[config_validation]
mode = "fail_fast"
validate_llm_keys = true

# ── Config search paths ──────────────────────────────────────────────────────
[config_search_paths]
default_toml = "config/default.toml"
local_toml = "config/local.toml"

# ── LLM settings ─────────────────────────────────────────────────────────────
llm_provider = "deepseek"
deep_think_llm = "deepseek-v4-pro"
quick_think_llm = "deepseek-v4-flash"
# backend_url: leave unset to use each provider's default endpoint
# google_thinking_level: "high", "minimal", etc.
# openai_reasoning_effort: "medium", "high", "low"
# anthropic_effort: "high", "medium", "low"

# ── LLM provider fallback ────────────────────────────────────────────────────
[llm_fallback]
enabled = true
fallback_providers = ["openrouter", "openai"]
circuit_breaker_threshold = 3
circuit_breaker_window_sec = 300

# ── Secrets ──────────────────────────────────────────────────────────────────
[secrets]
source = "env"         # "env" | "keyring" | "env,keyring"
warn_on_plaintext_env = true

# ── Asset class ──────────────────────────────────────────────────────────────
asset_class = "crypto"
crypto_exchange = "binance"
crypto_benchmark = "BTC/USDT"

# ── Output language ──────────────────────────────────────────────────────────
output_language = "English"

# ── Debate and discussion ────────────────────────────────────────────────────
max_debate_rounds = 1
max_risk_discuss_rounds = 1
max_recur_limit = 100

# ── Data vendor disable list ──────────────────────────────────────────────────
disabled_data_vendors = []

# ── Checkpoint / resume ──────────────────────────────────────────────────────
checkpoint_enabled = false

# ── Memory log ───────────────────────────────────────────────────────────────
# memory_log_max_entries: cap on resolved entries (null = unlimited)

# ── Data vendors ─────────────────────────────────────────────────────────────
[data_vendors]
technical_indicators = "ccxt"
news_data = "ccxt"
crypto_ohlcv = "ccxt"
crypto_onchain = "ccxt,coingecko"

[tool_vendors]

# ── Provider runtime resilience ──────────────────────────────────────────────
[provider_runtime]
enabled = true
timeout_sec = 20.0
retries = 2
backoff_base_sec = 0.35
backoff_max_sec = 2.5
rate_limit_per_sec = 8.0

# ── Stale data ───────────────────────────────────────────────────────────────
[stale_data]
mode = "warn"
max_age_hours = 24.0

# ── Observability ────────────────────────────────────────────────────────────
[observability]
persist_run_events = true
persist_data_provider_calls = true
persist_llm_calls = true
persist_snapshot_health = true
data_provider_call_sample_rate = 1.0

# ── Signal / quant weights ───────────────────────────────────────────────────
[signal_weights]
funding_oi = 0.20
rsi_divergence = 0.12
macd = 0.08
volume_profile = 0.12
liquidations = 0.12
regime = 0.16
onchain = 0.20

[signal_thresholds]
strong_buy = 0.60
buy = 0.25
sell = -0.25
strong_sell = -0.60

# ── Fixed position sizing ────────────────────────────────────────────────────
[fixed_sizing]
buy = 0.25
overweight = 0.15
hold = 0.0
underweight = -0.10
sell = -1.0

atr_risk_target = 0.02
stress_test_threshold = 0.30

# ── Assisted trade plan (research workstation, no autonomous execution) ──────
[planning]
enabled = false
mode = "planning"
exchange = "bitget"
market_type = "spot"
demo = false
bypass_blocks = false
position_sizing = "fixed"
volatility_target_daily = 0.01
kelly_fraction = 0.5
initial_balance = 10000.0

[planning.optimizer]
method = "rating_weighted"
max_turnover = 0.20
min_position_pct = 0.05

[planning.risk_limits]
max_position_size_pct = 30.0
max_leverage = 3
max_drawdown_pct = 15.0
max_open_positions = 5

[planning.confidence_thresholds]
force_hold = 0.05
penalty_50 = 0.15
penalty_70 = 0.25

[planning.monitoring]
enabled = false
poll_interval_sec = 30
trailing_stop_pct = 5.0
trailing_stop_activation_pct = 3.0
max_holding_hours = 0
auto_close = false
reanalyze_on_signal_change = false
max_runtime_hours = 0

[planning.monitoring.spot]
reeval_interval_hours = 24
min_holding_days = 0
thesis_break_indicators = ["fundamental_change", "onchain_anomaly"]
trailing_stop_pct = 0
auto_close = false

[planning.monitoring.futures]
poll_interval_sec = 1.0
trailing_stop_pct = 5.0
trailing_stop_activation_pct = 3.0
auto_close = false
funding_rate_alert_threshold = 0.01
liquidation_buffer_pct = 5.0

[planning.websocket]
enabled = false
ticker_streams = true
order_streams = true
position_streams = true
funding_rate_streams = true
reconnect_on_error = true
max_reconnect_attempts = 5
reconnect_delay_sec = 3
stale_threshold_sec = 5.0
